<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<title>Balancete</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    margin:20px;
}

h2{
    color:#004080;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#004080;
    color:white;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
}

td{
    background:white;
}

button{

    padding:6px 12px;
    cursor:pointer;
    margin:3px;

}

</style>

</head>

<body>

<h2>Balancete</h2>

<table id="tabela">

<thead>

<tr>

    <th>Nome</th>
    <th>Valor</th>
    <th>Data</th>
    <th>Observação</th>
    <th>Ação</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

<br>

<button onclick="novaLinha()">

Nova Linha

</button>

<script>

let dados=[];

async function carregarJSON(){

    try{

        const resposta =
            await fetch("balancete.json");

        dados =
            await resposta.json();

        atualizarTabela();

    }
    catch(erro){

        console.error(erro);

        alert("Erro ao carregar balancete.json");

    }

}

function atualizarTabela(){

    const tbody =
        document.querySelector("#tabela tbody");

    tbody.innerHTML="";

    dados.forEach((item,indice)=>{

        let tr =
            document.createElement("tr");

        tr.innerHTML=`

        <td contenteditable="true">${item.nome}</td>

        <td contenteditable="true">${item.valor}</td>

        <td contenteditable="true">${item.data}</td>

        <td contenteditable="true">${item.obs}</td>

        <td>

            <button onclick="adicionarMarcador(this)">

                Adicionar

            </button>

        </td>

        `;

        tbody.appendChild(tr);

    });

}

function novaLinha(){

    let tbody =
        document.querySelector("#tabela tbody");

    let tr =
        document.createElement("tr");

    tr.innerHTML=`

        <td contenteditable="true"></td>

        <td contenteditable="true"></td>

        <td contenteditable="true"></td>

        <td contenteditable="true"></td>

        <td>

            <button onclick="adicionarMarcador(this)">

                Adicionar

            </button>

        </td>

    `;

    tbody.appendChild(tr);

}

function adicionarMarcador(botao){

    let linha =
        botao.parentNode.parentNode;

    let nome =
        linha.cells[0].innerText;

    let valor =
        linha.cells[1].innerText;

    let data =
        linha.cells[2].innerText;

    let obs =
        linha.cells[3].innerText;

    console.log({

        nome,
        valor,
        data,
        obs

    });

    alert("Registro carregado.");

}

carregarJSON();

</script>

</body>

</html>
