<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CamerasRJ JSON</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
    font-family:Arial;
    margin:0;
}

#map{
    height:400px;
}

.frames{
    display:flex;
    flex-direction:column;
}

.frames iframe{
    width:100%;
    height:600px;
    border:1px solid #ccc;
}
</style>
</head>
<body>

<div id="map"></div>

<div class="frames">
    <iframe id="frame1"></iframe>
    <iframe id="frame2"></iframe>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView(
    [-22.984923686,-43.4606122],
    12
);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19
    }
).addTo(map);

let frameAtual = 1;

function abrirLink(link){

    if(frameAtual === 1){

        document
            .getElementById('frame1')
            .src = link;

        frameAtual = 2;

    }else{

        document
            .getElementById('frame2')
            .src = link;

        frameAtual = 1;
    }
}

async function carregarCameras(){

    try{

        const resposta =
            await fetch('./cameras.json');

        const cameras =
            await resposta.json();

        cameras.forEach(cam => {

            const marker =
                L.marker([
                    cam.latitude,
                    cam.longitude
                ]).addTo(map);

            marker.bindPopup(`
                <b>${cam.nome}</b>
                <br><br>
                <button onclick="abrirLink('${cam.url}')">
                    Abrir Câmera
                </button>
            `);

            marker.on(
                'dblclick',
                () => abrirLink(cam.url)
            );
        });

        console.log(
            cameras.length +
            ' câmeras carregadas'
        );

    }catch(erro){

        console.error(
            'Erro ao carregar cameras.json',
            erro
        );

        alert(
            'Não foi possível carregar cameras.json'
        );
    }
}

carregarCameras();

</script>

</body>
</html>
