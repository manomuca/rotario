<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dominó - Ponta de Cinco</title>

    <link rel="stylesheet" href="estyle.css">
</head>

<body>

    <main class="container">
        <!-- =========================
             PLACAR
        ========================== -->

        <section class="placar">

            <div class="jogador-card" id="cardJogador1">

                <input
                    type="text"
                    id="nomeJogador1"
                    value="Jogador 1"
                    class="nome-jogador"
                >

                <div
                    class="pontuacao"
                    id="pontuacaoJogador1">
                    0
                </div>

                <div class="barra">
                    <div
                        class="progresso"
                        id="progressoJogador1">
                    </div>
                </div>

                <small>Meta: 500</small>

            </div>


            <div class="vs">
            <p>🁫 Dominó</h1>
            <p>Ponta de Cinco</p>
            </div>


            <div class="jogador-card" id="cardJogador2">

                <input
                    type="text"
                    id="nomeJogador2"
                    value="Jogador 2"
                    class="nome-jogador"
                >

                <div
                    class="pontuacao"
                    id="pontuacaoJogador2">
                    0
                </div>

                <div class="barra">
                    <div
                        class="progresso2"
                        id="progressoJogador2">
                    </div>
                </div>

                <small>Meta: 500</small>

            </div>

        </section>


        <!-- =========================
             NOVA MÃO
        ========================== -->

        <section class="painel">

            <h2>Nova mão</h2>


            <div class="campo">

                <label>Quem bateu?</label>

                <div class="botoes-jogador">

                    <button
                        id="btnJogador1"
                        class="btn-jogador1"
                        onclick="adicionarPedraAoJogador(1)">
                        Jogador 1
                    </button>

            <div class="selecao-pedra">

                <h3>Adicionar pedra</h3>

                <div class="pedra-input">

                    <select id="ladoA">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>

                    <span>|</span>

                    <select id="ladoB">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                    </select>

                </div>

            </div>
                    <button
                        id="btnJogador2"
                        class="btn-jogador2"
                        onclick="adicionarPedraAoJogador(2)">
                        Jogador 2
                    </button>

                </div>

            </div>


            <div class="campo">

                <label>
                    Pedras adicionadas
                </label>

                <div
                    id="pedrasSelecionadas"
                    class="pedras-selecionadas">
                </div>

            </div>


            <!-- TECLADO DE PEDRAS -->


         

            </div>
<!-- =========================
     TECLADO NUMÉRICO
========================== -->
<div class="teclado-total">

    <h3>Ou informe o total das pedras</h3>

    
    <div class="teclas">
        <button type="button" onclick="digitarNumero(1)">1</button>
        <button type="button" onclick="digitarNumero(2)">2</button>
        <button type="button" onclick="digitarNumero(3)">3</button>
        
        <button type="button" onclick="digitarNumero(4)">4</button>
        <button type="button" onclick="digitarNumero(5)">5</button>
        <button type="button" onclick="digitarNumero(6)">6</button>
        
        <button type="button" onclick="digitarNumero(7)">7</button>
        <button type="button" onclick="digitarNumero(8)">8</button>
        <button type="button" onclick="digitarNumero(9)">9</button>
        
        <button type="button" onclick="apagarNumero()">←</button>
        <button type="button" onclick="digitarNumero(0)">0</button>
        <button type="button" onclick="limparNumero()">C</button>
    </div>
    
</div>
<!-- RESULTADO -->
</section>

<div id="displayTotal" class="display-total">0</div>

<div class="selecionar-vencedor">

    <label for="vencedorMao">
        Quem venceu a mão?
    </label>

    <select id="vencedorMao">
        <option value="">Selecione...</option>
        <option value="1">Jogador 1</option>
        <option value="2">Jogador 2</option>
    </select>

</div>

            <button
                id="btnRegistrar"
                class="btn-registrar"
                onclick="registrarMao()">

                REGISTRAR MÃO

            </button>



        <!-- =========================
             HISTÓRICO
        ========================== -->

        <section class="painel">

            <div class="titulo-historico">

                <h2>Histórico</h2>

                <span id="contadorMaos">
                    0 mãos
                </span>

            </div>


            <div class="tabela-container">

                <table>

                    <thead>

                        <tr>
                            <th>Mão</th>
                            <th>Jogador 1</th>
                            <th>Jogador 2</th>
                            <th>Pedras</th>
                        </tr>

                    </thead>

                    <tbody id="historico">
                    </tbody>

                </table>

            </div>

        </section>


        <!-- =========================
             CONTROLES
        ========================== -->

        <section class="controles">

            <button
                onclick="desfazerMao()"
                class="btn-secundario">

                ↶ Desfazer última mão

            </button>


            <button
                onclick="novaPartida()"
                class="btn-perigo">

                Nova partida

            </button>

        </section>


        <!-- =========================
             MODAL VENCEDOR
        ========================== -->

        <div
            id="modalVencedor"
            class="modal">

            <div class="modal-conteudo">

                <div class="trofeu">
                    🏆
                </div>

                <h2>Fim de jogo!</h2>

                <p id="textoVencedor"></p>

                <button
                    onclick="novaPartida()"
                    class="btn-registrar">

                    NOVA PARTIDA

                </button>

            </div>

        </div>

    </main>


    <script src="escript.js"></script>

</body>
</html>
