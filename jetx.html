<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">



<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">
   <div class="lado-esquerdo">

       <!-- Painel esquerdo -->
       <div class="painel">
           
           <input
           type="text"
           id="visor"
           readonly
           placeholder="0.00">
           
           <div id="teclado">
               
               
               
               <button onclick="digitar(7)">7</button>
               <button onclick="digitar(8)">8</button>
               <button onclick="digitar(9)">9</button>
               
               <button onclick="digitar(4)">4</button>
               <button onclick="digitar(5)">5</button>
               <button onclick="digitar(6)">6</button>
               
               <button onclick="digitar(1)">1</button>
               <button onclick="digitar(2)">2</button>
               <button onclick="digitar(3)">3</button>
               
               <button onclick="digitar(0)">0</button>
               <button onclick="apagar()">⌫</button>
               <button onclick="limparVisor()">C</button>
               
               
            </div>
            
            
            
        </div>
        <textarea id="relatorio"        rows="12"        readonly></textarea>
    </div>
    
    <!-- Painel direito -->
    <div class="conteudo">
        
        <div class="topo">
            <button id="btnInserir" onclick="inserir()">            INSERIR        </button>

            <button id="btnRelatorio" onclick="gerarRelatorio()">Relatório            </button>

            <button id="btnLimparFila" onclick="limparFila()">Limpar Fila            </button>

            <button id="btnExcluir" onclick="excluirUltimo()">Excluir Último            </button>

        </div>

        

        <div id="fila"></div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
