
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Mapa com Frames Duplos</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<style>
body{font-family:Arial;margin:0}
#map{height:450px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:6px}
.frames{display:flex;height:500px}
.frames iframe{width:50%;border:1px solid #ccc}
</style>
</head>
<body>
<div id="map"></div>

<table id="tabela">
<thead><tr>
<th>Nome</th><th>Latitude</th><th>Longitude</th><th>URL</th><th>Ação</th>
</tr></thead>
<tbody>
<tr>
<td>Carnotim</td>
<td>-3.838873</td>
<td>-40.730253</td>
<td>https://familiascearenses.com.br</td>
<td><button onclick="adicionarMarcador(this)">Adicionar</button></td>
</tr>
</tbody>
</table>

<button onclick="novaLinha()">Nova Linha</button>

<div class="frames">
<iframe id="frame1"></iframe>
<iframe id="frame2"></iframe>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
var map=L.map('map').setView([-3.838873,-40.730253],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

let frameAtual=1;

function abrirLink(link){
 if(frameAtual===1){
   document.getElementById('frame1').src=link;
   frameAtual=2;
 }else{
   document.getElementById('frame2').src=link;
   frameAtual=1;
 }
}

function adicionarMarcador(btn){
 let linha=btn.parentNode.parentNode;
 let nome=linha.cells[0].innerText;
 let lat=parseFloat(linha.cells[1].innerText);
 let lng=parseFloat(linha.cells[2].innerText);
 let link=linha.cells[3].innerText;

 let marker=L.marker([lat,lng]).addTo(map);

 marker.bindPopup('<b>'+nome+'</b><br><button onclick="abrirLink(\''+link+'\')">Abrir</button>');

 marker.on('dblclick',function(){abrirLink(link);});
}

function novaLinha(){
 let tbody=document.querySelector('#tabela tbody');
 let tr=document.createElement('tr');
 tr.innerHTML='<td contenteditable="true">Novo Local</td><td contenteditable="true">-3.800000</td><td contenteditable="true">-40.700000</td><td contenteditable="true">https://</td><td><button onclick="adicionarMarcador(this)">Adicionar</button></td>';
 tbody.appendChild(tr);
}
</script>
</body>
</html>
